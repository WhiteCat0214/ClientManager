; ============================================================================
;  Mabinogi Client Manager 設定檔 (ClientManager.ini)
; ============================================================================
;  * 與 ClientManager.exe 放在同一個資料夾。
;  * 以分號 ; 開頭的行是註解。
;  * 程式會在執行中依選單操作自動更新下面的數值，也會保留這些註解。
;  * 想手動修改數值時，請先結束 ClientManager.exe，改完再啟動。
;  * 數值超出範圍時，程式會自動修正為合法值。
;  * 請保持 UTF-16 (含 BOM) 編碼，記事本直接開啟、儲存即可，不要改存成其他編碼。

[Settings]

; ---------------------------------------------------------------------------
;  語言 (設定：其他 > 語言，或選單：語言)
; ---------------------------------------------------------------------------

; Language  介面語言。優先讀取這個設定；設定為 auto 或沒有設定時，依系統語系自動選擇
;           (繁體中文系統用繁體中文、簡體中文系統用簡體中文、日文系統用日文、韓文系統用韓文，其餘用英文)。
;   範圍：auto = 自動選擇
;         zh-TW = 繁體中文    zh-CN = 简体中文    en = 英文    ja = 日本語    ko = 한국어
;   預設：auto
Language=auto

; ---------------------------------------------------------------------------
;  通知區域圖示 (設定：其他 > 連點兩下圖示的動作，或選單：連點兩下圖示的動作)
; ---------------------------------------------------------------------------

; DoubleClick  連點兩下通知區域圖示的動作 (遊戲沒有執行時會顯示「遊戲未啟動」的提示視窗)。
;         除了「開啟設定頁面」以外，切換後會在通知區域圖示上方短暫顯示該項目已啟用或關閉。
;   範圍：0 = 開啟設定頁面
;         1 = 切換無邊框 / 還原
;         2 = 啟用 / 關閉 CPU 限制
;         3 = 啟用 / 關閉監控
;         4 = 隱藏 / 顯示遊戲工作列
;   預設：0
DoubleClick=0

; ---------------------------------------------------------------------------
;  CPU 限制 (選單：限制CPU使用率)
; ---------------------------------------------------------------------------

; CpuEnabled  CPU 限制總開關。關閉時下面的 CpuMode / Ratio / Eco 都不會作動。
;   範圍：0 = 關閉，1 = 啟用        預設：0
CpuEnabled=0

; CpuMode  生效條件：什麼情況下才限制遊戲的 CPU 使用率。
;   範圍：1 = 永遠限制
;         2 = 僅在視窗最小化時
;         3 = 僅在視窗最小化或於背景執行時
;   預設：2
CpuMode=2

; Ratio  限制比例：每個短週期內「暫停遊戲」的時間百分比，越大越省 CPU，但遊戲越不流暢。
;   範圍：1 ~ 99 (選單提供 30 / 50 / 70 / 80 / 90 / 95 / 98)        預設：95
Ratio=95

; Eco  限制生效時，是否同時降低遊戲的優先權並啟用節能模式。
;   啟用時：CPU 優先權、GPU 優先權降為最低 (Idle)，I/O 優先權降為極低，並啟用節能模式 (EcoQoS)；
;           解除限制後還原成下面 CpuPriority / GpuPriority / IoPriority 的設定值。
;   範圍：0 = 不降低，1 = 降低        預設：1
Eco=1

; ---------------------------------------------------------------------------
;  遊戲優先權 / 親和性 (選單：遊戲優先權 / 親和性)
;  偵測到 Client.exe 啟動後會自動套用，之後每隔幾秒確認一次，被改回去時會再套用。
;  0 代表「尚未設定」：第一次偵測到遊戲時，程式會讀取遊戲目前的值並寫回這裡。
; ---------------------------------------------------------------------------

; CpuPriority  CPU 優先權 (行程優先順序等級)。
;   範圍：0 = 尚未設定 (自動讀取遊戲目前值)
;         1 = 低 (Idle)           2 = 低於標準        3 = 標準
;         4 = 高於標準            5 = 高              6 = 即時 (Realtime，請謹慎使用)
;   預設：0
CpuPriority=0

; CpuAffinityMask  CPU 親和性：遊戲允許使用哪些邏輯核心。
;   格式：十進位整數，每個 bit 代表一個邏輯核心 (bit 0 = 核心 0，bit 1 = 核心 1 ...)。
;   範例：255 = 核心 0~7，65535 = 核心 0~15，268435455 = 核心 0~27
;   範圍：0 = 尚未設定 (自動讀取遊戲目前值)，或至少包含一個核心的遮罩。
;   預設：0
;   (建議直接用選單勾選核心，選單會標示每個核心是大核 / 小核 / 超執行緒)
;   注意：這個數值只對「記錄它的那台電腦」有意義。把設定檔搬到不同的 CPU 時，
;         程式會比對下面的 CpuTopology，發現核心配置不同就自動重設為 0，並通知使用者。
CpuAffinityMask=0

; CpuTopology  記錄 CpuAffinityMask 時，這台電腦的 CPU 核心配置簽章 (自動記錄，請勿手動修改)。
;   預設：空白
CpuTopology=

; GpuPriority  GPU 排程優先權。
;   範圍：0 = 尚未設定 (自動讀取遊戲目前值)
;         1 = 低 (Idle)           2 = 低於標準        3 = 標準
;         4 = 高於標準            5 = 高              6 = 即時 (Realtime)
;   預設：0
;   (工作管理員看不到這個值；把滑鼠停在通知區域圖示上，提示文字會顯示遊戲目前實際的優先權)
GpuPriority=0

; IoPriority  I/O 優先權 (磁碟存取優先順序)。
;   範圍：0 = 尚未設定 (自動讀取遊戲目前值)
;         1 = 極低    2 = 低    3 = 正常    4 = 高
;   預設：0
IoPriority=0

; ShowTip  是否在通知區域圖示的工具提示 (滑鼠停在圖示上時) 顯示遊戲目前實際的優先權與親和性。
;   範圍：0 = 不顯示 (只顯示程式名稱與限制狀態)，1 = 顯示        預設：1
ShowTip=1

; ---------------------------------------------------------------------------
;  視窗狀態 (選單：切換無邊框 / 還原、鎖定視窗大小及位置)
;  遊戲重啟後會自動套用；工具啟動時若遊戲正在執行，會以遊戲目前的實際狀態為準。
; ---------------------------------------------------------------------------

; Borderless  遊戲視窗是否為無邊框 (鋪滿所在螢幕的工作區，不含工作列)。
;   範圍：0 = 一般視窗，1 = 無邊框        預設：0
Borderless=0

; Locked  是否鎖定視窗大小及位置：移除縮放邊框與最大化按鈕、標題列右鍵選單的「移動」變灰、
;         無法用滑鼠拖曳視窗。
;   範圍：0 = 不鎖定，1 = 鎖定            預設：0
Locked=0

; LockStyle  「鎖定視窗大小及位置」的做法。
;   0 = 不改變視窗樣式 (預設)：標題列選單的「移動」「大小」「最大化」變灰，並取消用滑鼠拖曳視窗位置與邊框縮放。
;   1 = 移除縮放邊框與最大化按鈕 (舊做法)：部分情況下 (例如鎖定中從遊戲裡切換顯示器模式) 遊戲自己切換模式可能會沒有反應。
;   範圍：0 / 1                           預設：0
LockStyle=0

; HideTaskbar  是否隱藏遊戲在工作列上的按鈕 (選單：隱藏遊戲工作列)。只隱藏工作列按鈕，不改變視窗本身；
;         遊戲重啟後會自動套用，結束本工具時會先恢復按鈕 (設定值仍保留)。
;   範圍：0 = 顯示，1 = 隱藏              預設：0
HideTaskbar=0

; MouseClip  限制滑鼠移動範圍 (選單：限制滑鼠移動範圍)。避免遊戲在全螢幕模式下，滑鼠移到畫面邊緣時觸發視角變化。
;         啟用時，只有在遊戲處於全螢幕模式且為前景視窗時，滑鼠才無法移動到遊戲畫面內上下左右邊緣各 15 像素的範圍。
;   範圍：0 = 關閉，1 = 啟用              預設：0
MouseClip=0

; MouseClipMargin  「限制滑鼠移動範圍」的邊界寬度：滑鼠無法移動到遊戲畫面內上下左右邊緣這麼多像素的範圍。
;         修改後，把「限制滑鼠移動範圍」關閉再重新開啟就會生效 (不用重開本工具)。
;   範圍：0 ~ 200 (像素)                  預設：15
MouseClipMargin=15

; MouseClipBorderless  「限制滑鼠移動範圍」是否也套用在遊戲的「無邊框全視窗模式」。
;         0 = 只在遊戲的「全螢幕模式」(Direct3D 獨佔全螢幕) 生效。依遊戲的行為，畫面邊緣的視角轉向只會發生在全螢幕模式，所以預設只在這個模式限制。
;         1 = 全螢幕模式與無邊框全視窗模式都生效 (若全螢幕模式沒有被正確辨識，可以先設成 1 當作備案)。
;   範圍：0 / 1                           預設：0
MouseClipBorderless=0

; ---------------------------------------------------------------------------
;  效能監控 (選單：效能監控)
;  在遊戲畫面上顯示 CPU / RAM / GPU / VRAM / FPS / Latency 的文字疊加視窗 (標籤固定為英文)。
;  下面各項目的「顯示」= 是否顯示該項目；「比例」= 百分比；「實際值」= 時脈或 MB 數。
;  資料不可用時會顯示 --。百分比為整數時不顯示小數，否則顯示到小數第一位 (例如 8% 與 12.3%)。
;  這些項目平常用右鍵選單的「設定...」(效能監控頁) 調整；設定視窗按「確定」才會寫入這個檔案。
;  ini 可設定的範圍比設定視窗的下拉選單廣；手動設成選單沒有的合法值時，下拉選單會多出一個項目保留原值。
; ---------------------------------------------------------------------------

; OvEnabled  啟用效能監控。
;   範圍：0 = 關閉，1 = 啟用        預設：0
OvEnabled=0

; OvCpu / OvCpuPct / OvCpuGhz  CPU：是否顯示 / 顯示比例 / 顯示實際值 (目前時脈，GHz)。
;   比例 = 遊戲的 CPU 使用率 (以全部核心為 100%，同工作管理員)；時脈 = 遊戲可使用的核心的平均時脈。
;   CPU 限制中時，CPU 項目後方會加註「(限制中)」。
;   範圍：各為 0 / 1        預設：1 / 1 / 0
OvCpu=1
OvCpuPct=1
OvCpuGhz=0

; OvCpuMethod  CPU 使用率的算法 (設定視窗「顯示設定」也可以選)。
;   範圍：0 = 週期法 (預設)：以 CPU 週期數與 CPU 額定頻率計算
;         1 = 時間法 (以行程 CPU 時間計算，同 Process Explorer，短暫又頻繁的執行時間容易被少算)
;         2 = 估算 (行程 CPU 時間 x 整體 CPU 的 % Processor Utility / % Processor Time，
;             用來模擬依頻率換算的數值)
;   某個算法取不到資料時，依序退回：週期法 -> 時間法。
;   預設：0
OvCpuMethod=0

; OvRam / OvRamPct / OvRamMb  RAM：是否顯示 / 顯示比例 / 顯示實際值 (MB)。
;   數值為遊戲的「私有工作集」，與工作管理員的「記憶體」欄位相同；比例 = 佔全部實體記憶體的百分比。
;   範圍：各為 0 / 1        預設：1 / 1 / 0
OvRam=1
OvRamPct=1
OvRamMb=0

; OvGpu  GPU：是否顯示 (只有比例，同工作管理員取各引擎中最高的使用率)。
;   範圍：0 / 1             預設：1
OvGpu=1

; OvVram / OvVramPct / OvVramMb  VRAM (專用顯示記憶體)：是否顯示 / 顯示比例 / 顯示實際值 (MB)。
;   比例 = 遊戲使用量 / 該顯示卡的專用顯示記憶體總量；內建顯示晶片沒有專用顯示記憶體時比例顯示 --。
;   範圍：各為 0 / 1        預設：1 / 1 / 0
OvVram=1
OvVramPct=1
OvVramMb=0

; OvFps  FPS：是否顯示 (只顯示數字)。目前支援 D3D9 與 D3D10 / 11 / 12 的遊戲。
;   範圍：0 / 1             預設：1
OvFps=1

; OvLatency  Latency：是否顯示遊戲與伺服器之間的網路延遲 (毫秒)，格式「Latency: 52 ms」。
;   數值同資源監視器「網路 > TCP 連線」的延遲，只看遊戲行程的連線並排除連接埠 80 / 443 與聊天伺服器：
;   已進入遊戲 (分流後) 時取連接埠 >= 11000 的連線，登入畫面則使用啟動參數的 logip / logport。
;   範圍：0 / 1             預設：1
OvLatency=1

; OvLatencyMethod  Latency 的取樣方式 (設定視窗「顯示設定」也可以選)。
;   範圍：0 = 最近一次樣本值 (預設，反應最即時)
;         1 = 平滑往返時間 (有記憶的平均值，變動較小也較慢)
;   預設：0
OvLatencyMethod=0

; OvLayout  排列方式。
;   範圍：0 = 直式 (每行一項)，1 = 橫式 (所有項目排成一行，用分隔文字隔開)        預設：0
OvLayout=0

; OvSeparator  橫式的分隔文字。
;   空白時只用一個空格分隔 (A B)；有文字時前後各加一個空格 (例如設成 | 會顯示 A | B)。
;   最多 12 個字元。
;   預設：空白
OvSeparator=

; OvOrder  顯示項目的順序 (用逗號分隔)；設定視窗的「順序」清單可用滑鼠拖曳調整。
;   可用名稱：CPU, RAM, GPU, VRAM, FPS, Latency；缺少的項目會依預設順序補在最後。
;   預設：CPU,RAM,GPU,VRAM,FPS,Latency
OvOrder=CPU,RAM,GPU,VRAM,FPS,Latency

; OvFgOnly  只在遊戲為前景視窗時顯示 (遊戲最小化時一律隱藏)。
;   前景是本工具的選單、或工作列 / 縮圖預覽時維持目前狀態，避免閃爍。
;   開啟「監控設定」視窗期間固定顯示，不受這個設定影響。
;   範圍：0 / 1             預設：0
OvFgOnly=0

; OvLocked  鎖定位置：鎖定後滑鼠會穿透疊加視窗，要解鎖只能從選單。
;   範圍：0 = 未鎖定 (可用滑鼠拖曳)，1 = 鎖定        預設：0
OvLocked=0

; OvLockNoBg  鎖定時無背景 (設定視窗的「外觀」區)。
;   開啟時：鎖定後沒有背景；未鎖定時顯示淺黑色半透明背景 (方便拖曳)。
;   關閉時：鎖定與未鎖定都使用 OvBgColor 的背景。
;   範圍：0 / 1             預設：1
OvLockNoBg=1

; OvInterval  更新間隔 (毫秒)。選單提供 500 / 1000 / 2000。
;   範圍：250 ~ 5000        預設：1000
OvInterval=1000

; OvFontSize  字體大小 (pt)。
;   範圍：8 ~ 48            預設：14
OvFontSize=14

; OvOpacity  整體不透明度 (%)，100 = 完全不透明。
;   範圍：20 ~ 100          預設：100
OvOpacity=100

; OvTextColor / OvOutlineColor / OvBgColor  字體顏色 / 文字外框顏色 / 背景顏色。
;   格式：6 位數 HEX (RRGGBB)，例如 FFFFFF = 白色。可在選單「外觀」輸入。
;   預設：FFFFFF / 000000 / 1E1E1E (深色)
OvTextColor=FFFFFF
OvOutlineColor=000000
OvBgColor=1E1E1E

; OvX / OvY / OvMonitor  疊加視窗的位置：所在螢幕的裝置名稱，與相對於該螢幕左上角的偏移 (像素)。
;   拖曳視窗後會自動更新；OvMonitor 空白代表主螢幕。螢幕不存在時會退回主螢幕。
;   範圍：OvX、OvY = 0 ~ 20000        預設：20 / 20 / 空白
OvX=20
OvY=20
OvMonitor=

; ---------------------------------------------------------------------------
;  遊戲資訊 (自動記錄，通常不需要手動修改)
; ---------------------------------------------------------------------------

; ClientPath  最後一次偵測到的 Client.exe 完整路徑。遊戲沒有執行時，「重啟遊戲」會使用它。
;   範圍：完整檔案路徑，或空白        預設：空白 (空白時會嘗試 C:\Nexon\Mabinogi\Client.exe)
ClientPath=

; ClientArgs  最後一次偵測到的 Client.exe 啟動參數。遊戲沒有執行時，「重啟遊戲 (Client.exe)」會使用它。
;   透過官方網頁登入器啟動時帶入的 /N: 與 /V: (臨時登入帳號密碼) 以及 /T: (橘子標誌，通常是 /T:gamania) 參數，
;   不會儲存在這裡，重啟遊戲時也不會帶入 (因此重啟後需要重新登入)。
;   範圍：任意文字，或空白            預設：空白
ClientArgs=

; ---------------------------------------------------------------------------
;  圖片置頂 (設定：圖片置頂；選單：圖片置頂)
;  全域設定放在這裡，每一組 (第 1 ~ 10 組) 的設定放在檔案最後面的 [Image1] ~ [Image10]。
; ---------------------------------------------------------------------------

; ImgMaster  圖片置頂總開關 (選單：圖片置頂 > 啟用圖片置頂 (全域啟用))。
;   關閉時所有圖片都隱藏；再次開啟時，回復成各組原本的啟用狀態 (不是全部強制顯示)。
;   範圍：0 = 關閉，1 = 開啟        預設：0
ImgMaster=0

; ImgLockAll  全域鎖定 (選單：圖片置頂 > 鎖定全部圖片 (全域鎖定))。
;   開啟時所有組別都視為鎖定 (沒有背景與縮放控制點，滑鼠穿透)，不論各組自己的 Locked 設定。
;   範圍：0 = 不鎖定，1 = 鎖定      預設：0
ImgLockAll=0

; ============================================================================
;  圖片置頂：每一組的設定 ([Image1] ~ [Image10])
;  拖曳 / 縮放 / 方向鍵微調圖片後，Monitor / X / Y / Scale 會自動更新。
;  [Image2] ~ [Image10] 的內容與 [Image1] 相同，只有預設值不同 (Source、Y、Z)，說明請看 [Image1]。
; ============================================================================

[Image1]

; Enabled  啟用這一組 (選單：圖片置頂 > 啟用第N組)。只有啟用的組別才會載入圖片，沒有啟用的組別不佔用記憶體與 CPU。
;   範圍：0 = 不啟用，1 = 啟用      預設：0
Enabled=0

; Locked  鎖定這一組。鎖定後沒有半透明背景與縮放控制點，整個視窗滑鼠穿透，不影響下方遊戲或網頁的操作。
;   未鎖定時：可用滑鼠拖曳移動，拖曳四角的控制點等比例縮放，點一下圖片後可用方向鍵以 1 像素微調 (Shift = 10 像素)。
;   範圍：0 = 未鎖定，1 = 鎖定      預設：0
Locked=0

; FgOnly  僅在遊戲視窗為前景時顯示。前景是本工具的選單 / 設定視窗或工作列時維持目前狀態。
;   範圍：0 = 一律顯示，1 = 僅在遊戲為前景時顯示      預設：0
FgOnly=0

; Name  這一組的名稱 (顯示在選單與設定視窗的組別清單)，可以空白。
;   範圍：最多 40 個字元            預設：空白
Name=

; Source  圖片來源。
;   範圍：0 = 內建料理尺 (白色)
;         1 = 內建料理尺 (黑色)
;         2 = 內建料理尺 (自訂顏色，使用下面的 RulerColor)
;         3 = 自選圖片 (使用下面的 Path)
;   預設：0 ([Image2] 預設為 1)
Source=0

; RulerColor  內建料理尺 (Source=2) 的顏色，6 位數 16 進位 RRGGBB (可以有前面的 #)，例如 FFFFFF = 白色，000000 = 黑色，FFD700 = 金色。
;   格式不對時使用預設值。
;   範圍：000000 ~ FFFFFF           預設：FFFFFF
RulerColor=FFFFFF

; Path  自選圖片 (Source=3) 的完整路徑，支援 .jpg / .jpeg / .png / .gif。
;   只記錄原始路徑，不會複製檔案；檔案被移動或刪除時會顯示「圖片遺失」的占位框，請在設定視窗重新指定。
;   範圍：完整檔案路徑，或空白      預設：空白
Path=

; Opacity  不透明度 (%)，100 = 完全不透明。與 PNG 本身的透明通道相乘。
;   範圍：5 ~ 100                   預設：100
Opacity=100

; Scale  縮放比例 (%)，相對於旋轉後的原始大小。超出範圍時會自動修正：
;   最小值會讓短邊至少 4 像素、長邊至少 24 像素 (且不低於 10%)；最大值 1000%，且縮放後不超過 7680 像素 / 1600 萬像素。
;   圖片 (縮放後) 必須完整位於螢幕內；圖片本身比螢幕大時不限制。
;   範圍：10 ~ 1000                 預設：100
Scale=100

; Monitor / X / Y  圖片左上角的位置：所在螢幕的裝置名稱，與相對於該螢幕左上角的偏移 (像素)。
;   Monitor 空白代表主螢幕；螢幕不存在時退回主螢幕。
;   範圍：X、Y 為整數 (超出螢幕時會自動修正到螢幕內)      預設：X = 100，Y = 100 + 30 x (組別 - 1)，Monitor 空白
Monitor=
X=100
Y=100

; FlipH  水平翻轉。
;   範圍：0 = 否，1 = 是            預設：0
FlipH=0

; Rotate  順時針旋轉角度。
;   範圍：0 / 90 / 180 / 270        預設：0
Rotate=0

; GifPaused / GifSpeed  GIF 動畫：是否暫停、播放速度 (%，100 = 原速)。靜態圖片不受影響。
;   範圍：GifPaused = 0 / 1，GifSpeed = 10 ~ 1000      預設：0 / 100
GifPaused=0
GifSpeed=100

; Z  層級：數字越大越在上層。10 組各佔一個，不可重複 (重複或缺少時程式會依順序重新編號)。
;   範圍：0 ~ 9                     預設：組別 - 1 ([Image1] = 0，[Image10] = 9)
Z=0

